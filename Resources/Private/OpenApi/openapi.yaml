          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        '201':
          description: The created collection.
          content:
            application/json:
              schema:
                type: object
                required: [collection]
                properties:
                  collection: { $ref: '#/components/schemas/MediaCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/media/collections/{collectionIdentifier}:
    patch:
      tags: [Media]
      operationId: updateCollection
      summary: Rename a collection
      security:
        - oauth2: [neos.media]
      parameters:
        - name: collectionIdentifier
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        '200':
          description: The updated collection.
          content:
            application/json:
              schema:
                type: object
                required: [collection]
                properties:
                  collection: { $ref: '#/components/schemas/MediaCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
