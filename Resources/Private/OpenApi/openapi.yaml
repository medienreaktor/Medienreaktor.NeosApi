        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`collection_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/media/tags:
    get:
      tags: [Media]
      operationId: listMediaTags
      summary: The tag tree
      security:
        - oauth2: [neos.media]
      responses:
        '200':
          description: Root tags with nested children.
          content:
            application/json:
              schema:
                type: object
                required: [tags]
