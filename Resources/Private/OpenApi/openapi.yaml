                  tags:
                    type: array
                    items: { $ref: '#/components/schemas/MediaTag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Media]
      operationId: createMediaTag
      summary: Create a tag
      description: An unknown `parent` identifier is silently ignored (the tag is created at root).
      security:
        - oauth2: [neos.media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                parent: { type: [string, 'null'], description: Parent tag identifier; null or empty for a root tag. }
      responses:
        '201':
          description: The created tag.
          content:
            application/json:
              schema:
                type: object
                required: [tag]
                properties:
                  tag: { $ref: '#/components/schemas/MediaTag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/media/tags/{tagIdentifier}:
    patch:
      tags: [Media]
      operationId: updateMediaTag
      summary: Rename or move a tag
      description: 'Absent keys stay unchanged; `parent: ""` moves the tag to root.'
      security:
        - oauth2: [neos.media]
      parameters:
        - name: tagIdentifier
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                parent:
                  type: string
                  description: New parent tag identifier; empty string moves to root.
      responses:
        '200':
          description: The updated tag with its subtree.
          content:
            application/json:
              schema:
                type: object
                required: [tag]
                properties:
                  tag: { $ref: '#/components/schemas/MediaTag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`tag_not_found` - the tag itself or a non-empty `parent`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Media]
      operationId: deleteMediaTag
      summary: Delete a tag
      description: Detaches the tag from all assets; child tags are removed with it.
      security:
        - oauth2: [neos.media]
      parameters:
        - name: tagIdentifier
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`tag_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:

  securitySchemes:
    # The flow URLs and the scope catalog are stamped in at serve time from
    # the configured issuer and Medienreaktor.NeosApi.oauth.scopes.
    oauth2:
      type: oauth2
      description: >
        OAuth 2.1 bearer tokens. Scopes can only narrow access - authorization
        is always additionally bound to the account's roles and the content
        repository's own permission checks.
      flows:
        authorizationCode:
          authorizationUrl: 'http://localhost:8080/oauth/authorize'
          tokenUrl: 'http://localhost:8080/oauth/token'
          refreshUrl: 'http://localhost:8080/oauth/token'
          scopes:
            neos.read: 'Read nodes, workspaces, node types and dimensions'
            neos.write: 'Execute content repository commands'
            neos.publish: 'Publish, discard and rebase workspaces'
            neos.media: 'Browse, upload and manage media assets'
        clientCredentials:
          tokenUrl: 'http://localhost:8080/oauth/token'
          scopes:
            neos.read: 'Read nodes, workspaces, node types and dimensions'
            neos.write: 'Execute content repository commands'
            neos.publish: 'Publish, discard and rebase workspaces'
            neos.media: 'Browse, upload and manage media assets'

  parameters:
    nodeAddress:
      name: nodeAddress
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NodeAddress' }
    nodeTypesFilter:
      name: nodeTypes
      in: query
      required: false
      schema: { type: string }
      description: >
        Node type filter string with comma lists and `!` negation, e.g.
        `Neos.Neos:Document,!Neos.Neos:Shortcut`. On single-node reads it only
        constrains the `hasChildren` computation.
    visibility:
      name: visibility
      in: query
      required: false
      schema: { type: string, enum: [frontend] }
      description: '`frontend` additionally excludes disabled (hidden) nodes.'
    includeDeleted:
      name: includeDeleted
      in: query
      required: false
      schema: { type: string }
      description: >
        Any non-empty value (e.g. `1`) makes soft-removed nodes visible -
        for trash previews and restore flows.
    workspaceName:
      name: workspaceName
      in: path
      required: true
      schema: { type: string }
    siteNodeName:
      name: siteNodeName
      in: path
      required: true
      schema: { type: string }
      description: 'The site''s node name (`Site.nodeName`).'
    domainId:
      name: domainId
      in: path
      required: true
      schema: { type: string }
      description: The domain's identifier.
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9\-]{1,40}$' }
    assetSource:
      name: assetSource
      in: path
      required: true
      schema: { type: string }
      description: 'Asset source identifier; only `neos` is writable.'
    assetIdentifier:
      name: assetIdentifier
      in: path
      required: true
      schema: { type: string }
      description: The asset's identifier within its asset source.

  responses:
    Unauthorized:
      description: '`unauthorized` - no authenticated bearer token present.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        `insufficient_scope` (the token lacks the required scope),
        `access_denied` (workspace/content permissions), or a Flow policy
        denial (accounts whose roles do not grant the endpoint; that body is
        Flow's own error format, not this envelope).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidNodeAddress:
      description: '`invalid_node_address` - the address could not be parsed or belongs to another content repository.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WorkspaceNotFound:
      description: '`workspace_not_found`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WorkspaceOperationConflict:
      description: >
        `rebase_conflicts` or `partial_publish_conflicts` (both carry a
        `conflicts` array; the former is retryable with a forced rebase, the
        latter means the selection is not separable), or `operation_failed`
        (any other failure, including an unknown workspace).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  conflicts:
                    type: array
                    items: { $ref: '#/components/schemas/RebaseConflict' }
    AssetSourceNotWritable:
      description: '`asset_source_not_writable` - only `neos` assets can be modified.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # --- Cross-cutting ------------------------------------------------------

    Error:
      type: object
      required: [error, error_description]
      properties:
        error:
          type: string
          description: Stable machine-readable code, e.g. `node_not_found`.
        error_description:
          type: string
          description: Human-readable message.
      additionalProperties: true
      description: >
        The uniform error body. Some errors merge extra detail fields at the
        top level (e.g. `conflicts`, `dependents`, `pendingChanges`).

    BatchError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            executed:
              type: integer
              description: Commands successfully applied before the failure - NOT rolled back.
            failedIndex:
              type: integer
              description: 0-based index of the failing command.
            failedType:
              type: string
              description: The failing command's type (`invalid` for a malformed element).
      description: >
        Batch failures carry the position of the failure; the envelope-level
        `invalid_request` (missing/empty `commands`) has no such fields.

    Success:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }

    NodeAddress:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      description: >
        Opaque URL-safe token addressing one node: content repository,
        workspace, dimension space point and node aggregate id. Obtained from
        the API, passed back verbatim.

    DimensionSpacePoint:
      type: object
      additionalProperties: { type: string }
      description: 'Dimension coordinates, e.g. `{"language": "de"}`; `{}` for a dimension-less repository.'

    # --- Nodes ----------------------------------------------------------------

    PropertyValue:
      oneOf:
        - type: 'null'
        - type: object
          required: [value, type]
          properties:
            value:
              description: JSON-safe serialized representation.
            type:
              type: string
              description: 'Declared type, e.g. `string`, `DateTimeImmutable`, `Neos\Media\Domain\Model\ImageInterface`.'
      description: '`null` means the property is explicitly unset.'

    Node:
      type: object
      required: [address, aggregateId, nodeType, name, label, classification, hasChildren, workspace, dimensionSpacePoint, originDimensionSpacePoint, properties, tags, timestamps]
      properties:
        address: { $ref: '#/components/schemas/NodeAddress' }
        aggregateId: { type: string }
        nodeType: { type: string }
        name:
          type: [string, 'null']
          description: '`null` for unnamed nodes.'
        label:
          type: string
          description: Plain-text node label (entities decoded, tags stripped).
        classification: { type: string, enum: [regular, root, tethered] }
        hasChildren:
          type: boolean
          description: Constrained by the request's `nodeTypes` filter when one was given.
        workspace: { type: string }
        dimensionSpacePoint: { $ref: '#/components/schemas/DimensionSpacePoint' }
        originDimensionSpacePoint: { $ref: '#/components/schemas/DimensionSpacePoint' }
        properties:
          type: object
          additionalProperties: { $ref: '#/components/schemas/PropertyValue' }
          description: 'Serialized property values. Caveat: serializes as `[]` for a property-less node.'
        tags:
          type: object
          required: [all, inherited]
          properties:
            all:
              type: array
              items: { type: string }
              description: All subtree tags (own + inherited), e.g. `removed`, `disabled`.
            inherited:
              type: array
              items: { type: string }
        timestamps:
          type: object
          required: [created, originalCreated, lastModified, originalLastModified]
          properties:
            created: { type: string, format: date-time }
            originalCreated: { type: string, format: date-time }
            lastModified: { type: [string, 'null'], format: date-time }
            originalLastModified: { type: [string, 'null'], format: date-time }

    NodeWithBreadcrumb:
      allOf:
        - $ref: '#/components/schemas/Node'
        - type: object
          properties:
            breadcrumb:
              type: array
              items: { type: string }
              description: >
                Document labels from the site root down to the node itself.
                Present on `descendants` results when `search` or
                `breadcrumbs` is used.

    Reference:
      type: object
      required: [referenceName, node, properties]
      properties:
        referenceName: { type: string }
        node: { $ref: '#/components/schemas/Node' }
        properties:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: { $ref: '#/components/schemas/PropertyValue' }
          description: Properties carried by the reference itself; `null` when it has none.

    NodeTypeSummary:
      type: object
      required: [name, abstract, superTypes, label, icon, group, position]
      properties:
        name: { type: string }
        abstract: { type: boolean }
        superTypes:
          type: array
          items: { type: string }
        label:
          type: [string, 'null']
          description: Raw `ui.label` - may be an untranslated XLIFF id.
        icon:
          type: [string, 'null']
          description: Normalized Font Awesome class.
        group:
          type: [string, 'null']
          description: '`null` means the type is not offered in creation dialogs.'
        position:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
          description: Raw Neos position specification.
        properties:
          type: object
          additionalProperties:
            type: object
            required: [type, label]
            properties:
              type: { type: [string, 'null'] }
              label: { type: [string, 'null'] }
          description: 'Only with `includeProperties=1`; underscore-prefixed internals are excluded.'
        references:
          type: object
          additionalProperties:
            type: object
            required: [label, maxItems]
            properties:
              label: { type: [string, 'null'] }
              maxItems:
                type: [integer, 'null']
                description: '`1` marks a singular reference.'
          description: 'Only with `includeProperties=1`.'

    # --- Me / users / sites -----------------------------------------------------

    Profile:
      type: object
      required: [firstName, lastName, fullName, email, interfaceLanguage, availableLanguages, preferences]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        email: { type: [string, 'null'] }
        interfaceLanguage: { type: string }
        availableLanguages:
          type: object
          additionalProperties: { type: string }
          description: 'Locale id => label, from `Neos.Neos.userInterface.availableLanguages`.'
        preferences:
          type: object
          additionalProperties: true
          description: Free-form client preferences, stored verbatim per key.

    User:
      type: object
      required: [id, label, firstName, lastName, fullName, email, active, roles, accounts, isCurrentUser]
      properties:
        id: { type: string, pattern: '^[a-z0-9\-]{1,40}$' }
        label: { type: string, description: Full name. }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        fullName: { type: string }
        email: { type: [string, 'null'] }
        active: { type: boolean }
        roles:
          type: array
          items: { type: string }
          description: Explicitly assigned role identifiers across all accounts (no implicit roles).
        accounts:
          type: array
          items:
            type: object
            required: [accountIdentifier, authenticationProvider, active]
            properties:
              accountIdentifier: { type: string }
              authenticationProvider: { type: string }
              active: { type: boolean }
        isCurrentUser: { type: boolean }

    Domain:
      type: object
      required: [id, hostname, scheme, port, active, isPrimary, url]
      properties:
        id: { type: string }
        hostname: { type: string }
        scheme: { type: [string, 'null'], enum: [http, https, null] }
        port: { type: [integer, 'null'] }
        active: { type: boolean }
        isPrimary:
          type: boolean
          description: True only for the explicitly configured primary domain.
        url: { type: string }

    Site:
      type: object
      required: [name, nodeName, state, siteResourcesPackageKey, domains, primaryDomain]
      properties:
        name: { type: string }
        nodeName: { type: string }
        state: { type: string, enum: [online, offline] }
        siteResourcesPackageKey: { type: string }
        domains:
          type: array
          items: { $ref: '#/components/schemas/Domain' }
        primaryDomain:
          type: [string, 'null']
          description: The effective primary domain (explicit one if active, else the first active).

    # --- Workspaces -------------------------------------------------------------

    WorkspaceStatus:
      type: string
      enum: [UP_TO_DATE, OUTDATED]

    Workspace:
      type: object
      required: [name, baseWorkspace, title, description, classification, owner, hasPublishableChanges, status, permissions, extensions]
      properties:
        name: { type: string }
        baseWorkspace:
          type: [string, 'null']
          description: '`null` for root workspaces.'
        title: { type: string }
        description: { type: string }
        classification: { type: string, enum: [PERSONAL, SHARED, ROOT, UNKNOWN] }
        owner:
          type: [string, 'null']
          description: Owning user id for personal workspaces.
        hasPublishableChanges: { type: boolean }
        status: { $ref: '#/components/schemas/WorkspaceStatus' }
        permissions:
          type: object
          required: [read, write, manage, publish]
          properties:
            read: { type: boolean }
            write: { type: boolean }
            manage: { type: boolean }
            publish:
              type: boolean
              description: Write permission on the base workspace.
        extensions:
          type: object
          additionalProperties: true
          description: >
            Contributions of registered workspace data enrichers
            (`Medienreaktor.NeosApi.workspaceDataEnrichers`), keyed by
            registration key. `{}` without enrichers.

    WorkspaceRoleAssignment:
      type: object
      required: [subjectType, subject, label, role]
      properties:
        subjectType: { type: string, enum: [USER, GROUP] }
        subject:
          type: string
          description: User id for USER, Flow role identifier for GROUP.
        label: { type: string }
        role: { type: string, enum: [VIEWER, COLLABORATOR, MANAGER] }

    WorkspaceOperationFilter:
      type: object
      properties:
        documents:
          type: array
          items: { type: string }
          description: Document aggregate ids - highest precedence.
        site:
          type: string
          description: Site aggregate id - used when `documents` is empty.
        document:
          type: string
          description: Single document aggregate id - lowest precedence.
      description: >
        Optional scope for publish/discard. Precedence `documents` > `site` >
        `document`; an empty body operates on the whole workspace.

    RebaseConflict:
      type: object
      required: [nodeAggregateId, nodeLabel, documentAggregateId, documentLabel, documentAddress, siteAggregateId, typeOfChange, reason, message, sequenceNumber]
      properties:
        nodeAggregateId: { type: [string, 'null'] }
        nodeLabel: { type: [string, 'null'] }
        documentAggregateId: { type: [string, 'null'] }
        documentLabel: { type: [string, 'null'] }
        documentAddress:
          oneOf:
            - $ref: '#/components/schemas/NodeAddress'
            - type: 'null'
        siteAggregateId: { type: [string, 'null'] }
        typeOfChange:
          type: [string, 'null']
          enum: [created, changed, moved, deleted, null]
        reason:
          type: [string, 'null']
          enum: [node_has_been_deleted, null]
        message: { type: string }
        sequenceNumber: { type: integer }

    DocumentChange:
      type: object
      required: [documentAggregateId, documentAddress, siteAggregateId, siteLabel, label, nodeType, icon, breadcrumb, hidden, created, changed, moved, deleted, changeCount]
      properties:
        documentAggregateId: { type: string }
        documentAddress:
          oneOf:
            - $ref: '#/components/schemas/NodeAddress'
            - type: 'null'
          description: '`null` when the document only resolves in the base workspace or is soft-removed.'
        siteAggregateId: { type: [string, 'null'] }
        siteLabel: { type: [string, 'null'] }
        label: { type: string }
        nodeType: { type: string }
        icon: { type: [string, 'null'] }
        breadcrumb:
          type: array
          items: { type: string }
        hidden: { type: boolean }
        created: { type: boolean }
        changed: { type: boolean }
        moved: { type: boolean }
        deleted: { type: boolean }
        changeCount:
          type: integer
          description: Distinct changed node aggregates within this document.

    TrashItem:
      type: object
      required: [nodeAggregateId, nodeAddress, label, nodeType, icon, isDocument, breadcrumb, siteAggregateId, siteLabel, dimensions, deletedAt, deletedBy, restoresAncestors]
      properties:
        nodeAggregateId: { type: string }
        nodeAddress:
          oneOf:
            - $ref: '#/components/schemas/NodeAddress'
            - type: 'null'
          description: Address of the first deleted variant.
        label: { type: string }
        nodeType: { type: string }
        icon: { type: [string, 'null'] }
        isDocument: { type: boolean }
        breadcrumb:
          type: array
          items: { type: string }
        siteAggregateId: { type: [string, 'null'] }
        siteLabel: { type: [string, 'null'] }
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/DimensionSpacePoint' }
          description: One coordinates object per deleted variant.
        deletedAt: { type: [string, 'null'], format: date-time }
        deletedBy: { type: [string, 'null'], description: User label. }
        restoresAncestors:
          type: array
          description: Deleted ancestors a restore would bring back, nearest first.
          items:
            type: object
            required: [nodeAggregateId, label]
            properties:
              nodeAggregateId: { type: string }
              label: { type: [string, 'null'] }

    NodeRef:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label:
          type: [string, 'null']
          description: '`null` when the node cannot be resolved.'

    ChangeRow:
      type: object
      required: [kind, property, label, old, new]
      properties:
        kind:
          type: string
          enum: [property, reference, nodeType, name, parent, position, tag, variant]
        property:
          type: [string, 'null']
          description: Property/reference/tag name for those kinds, else `null`.
        label:
          type: [string, 'null']
          description: UI label of the property (may be an XLIFF shorthand).
        old:
          description: >
            Depends on `kind` - property value, `NodeRef[]` for references,
            string for nodeType/name/tag, `NodeRef` for parent, dimension
            coordinates for variant, `null` for position.
        new:
          description: Same shape as `old`.

    FeedEvent:
      type: object
      required: [sequenceNumber, version, type, kind, nodeAggregateId, parentNodeAggregateId, dimensionSpacePoints, tag, initiatingUserId, recordedAt, command, initiatingTimestamp]
      properties:
        sequenceNumber:
          type: integer
          description: Global event store sequence number.
        version:
          type: integer
          description: 0-based position within the content stream.
        type:
          type: string
          enum: [NodePropertiesWereSet, NodeReferencesWereSet, NodeAggregateWithNodeWasCreated, NodeAggregateWasMoved, NodeAggregateWasRemoved, SubtreeWasTagged, SubtreeWasUntagged, NodeAggregateTypeWasChanged, NodeAggregateNameWasChanged, NodeSpecializationVariantWasCreated, NodeGeneralizationVariantWasCreated, NodePeerVariantWasCreated]
        kind: { type: string, enum: [content, structure] }
        nodeAggregateId: { type: [string, 'null'] }
        parentNodeAggregateId: { type: [string, 'null'] }
        dimensionSpacePoints:
          type: array
          items: { $ref: '#/components/schemas/DimensionSpacePoint' }
          description: '`[]` means the event affects every dimension.'
        tag:
          type: [string, 'null']
          description: 'For SubtreeWasTagged/Untagged, e.g. `disabled` or `removed`.'
        initiatingUserId: { type: [string, 'null'] }
        recordedAt: { type: string, format: date-time }
        command:
          type: [string, 'null']
          description: Short class name of the originating command.
        initiatingTimestamp: { type: [string, 'null'] }

    EnrichedFeedEvent:
      allOf:
        - $ref: '#/components/schemas/FeedEvent'
        - type: object
          required: [nodeLabel, nodeType, icon, initiatingUserLabel, documentAggregateId, documentLabel, documentAddress]
          properties:
            nodeLabel: { type: [string, 'null'] }
            nodeType: { type: [string, 'null'] }
            icon: { type: [string, 'null'] }
            initiatingUserLabel: { type: [string, 'null'] }
            documentAggregateId: { type: [string, 'null'] }
            documentLabel: { type: [string, 'null'] }
            documentAddress:
              oneOf:
                - $ref: '#/components/schemas/NodeAddress'
                - type: 'null'

    # --- Commands -----------------------------------------------------------

    CommandEnvelope:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [CreateNodeAggregateWithNode, SetNodeProperties, SetNodeReferences, MoveNodeAggregate, RemoveNodeAggregate, DisableNodeAggregate, EnableNodeAggregate, TagSubtree, UntagSubtree, CreateNodeVariant, ChangeNodeAggregateType, ChangeNodeAggregateName, CopyNodesRecursively]
        payload:
          oneOf:
            - $ref: '#/components/schemas/CreateNodeAggregateWithNode'
            - $ref: '#/components/schemas/SetNodeProperties'
            - $ref: '#/components/schemas/SetNodeReferences'
            - $ref: '#/components/schemas/MoveNodeAggregate'
            - $ref: '#/components/schemas/RemoveNodeAggregate'
            - $ref: '#/components/schemas/SubtreeVisibilityPayload'
            - $ref: '#/components/schemas/TagSubtreePayload'
            - $ref: '#/components/schemas/CreateNodeVariant'
            - $ref: '#/components/schemas/ChangeNodeAggregateType'
            - $ref: '#/components/schemas/ChangeNodeAggregateName'
            - $ref: '#/components/schemas/CopyNodesRecursively'
          description: The payload matching `type`.
      description: >
        The discriminated command union. `DisableNodeAggregate` /
        `EnableNodeAggregate` share the SubtreeVisibilityPayload shape;
        `TagSubtree` / `UntagSubtree` share TagSubtreePayload.

    WorkspaceNameValue:
      type: string
      pattern: '^[a-z0-9][a-z0-9\-]{0,35}$'

    NodeAggregateIdValue:
      type: string
      pattern: '^[a-z0-9\-]{1,64}$'

    CreateNodeAggregateWithNode:
      type: object
      required: [workspaceName, nodeAggregateId, nodeTypeName, parentNodeAggregateId]
      properties:
        workspaceName: { $ref: '#/components/schemas/WorkspaceNameValue' }
        nodeAggregateId:
          allOf: [{ $ref: '#/components/schemas/NodeAggregateIdValue' }]
          description: Client-supplied - generate an id and keep it.
        nodeTypeName: { type: string }
        parentNodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        originDimensionSpacePoint: { $ref: '#/components/schemas/DimensionSpacePoint' }
        initialPropertyValues:
          type: object
          additionalProperties: true
          description: Property name => value. Declared date-type properties accept strings.
        succeedingSiblingNodeAggregateId:
          allOf: [{ $ref: '#/components/schemas/NodeAggregateIdValue' }]
          description: Omitted = the node becomes the FIRST child of the parent.
        nodeName:
          type: string
          pattern: '^[a-z0-9\-]+$'
          description: Deprecated concept for non-tethered nodes.
        tetheredDescendantNodeAggregateIds:
          type: object
          additionalProperties: { $ref: '#/components/schemas/NodeAggregateIdValue' }
          description: >
            Node path (e.g. `main`) => id. Pin tethered child ids here to
            address them in later commands; unpinned ids are generated
            randomly. References cannot be set with this command - use a
            separate SetNodeReferences.

    SetNodeProperties:
      type: object
      required: [workspaceName, nodeAggregateId, originDimensionSpacePoint, propertyValues]
      properties:
        workspaceName: { $ref: '#/components/schemas/WorkspaceNameValue' }
        nodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        originDimensionSpacePoint: { $ref: '#/components/schemas/DimensionSpacePoint' }
        propertyValues:
          type: object
          minProperties: 1
          additionalProperties: true
          description: >
            Merged into existing properties; a `null` value unsets that
            property. Declared date-type properties accept strings; asset
            references are written as `{"__flow_object_type": "<FQCN>",
            "__identifier": "<uuid>"}`.

    SetNodeReferences:
      type: object
      required: [workspaceName, sourceNodeAggregateId, sourceOriginDimensionSpacePoint, references]
      properties:
        workspaceName: { $ref: '#/components/schemas/WorkspaceNameValue' }
        sourceNodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        sourceOriginDimensionSpacePoint: { $ref: '#/components/schemas/DimensionSpacePoint' }
        references:
          type: array
          minItems: 1
          items:
            type: object
            required: [referenceName, targets]
            properties:
              referenceName: { type: string }
              targets:
                type: array
                items: { $ref: '#/components/schemas/NodeAggregateIdValue' }
                description: An empty list clears the named reference.
          description: Each named reference is replaced, not merged. A name may appear only once.

    MoveNodeAggregate:
      type: object
      required: [workspaceName, dimensionSpacePoint, nodeAggregateId]
      properties:
        workspaceName: { $ref: '#/components/schemas/WorkspaceNameValue' }
        dimensionSpacePoint:
          allOf: [{ $ref: '#/components/schemas/DimensionSpacePoint' }]
          description: A covered dimension space point (not necessarily occupied).
        nodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        relationDistributionStrategy:
          type: string
          enum: [gatherAll, gatherSpecializations, scatter]
          default: gatherAll
        newParentNodeAggregateId:
          allOf: [{ $ref: '#/components/schemas/NodeAggregateIdValue' }]
          description: Omitted = keep the current parent (reorder only).
        newPrecedingSiblingNodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        newSucceedingSiblingNodeAggregateId:
          allOf: [{ $ref: '#/components/schemas/NodeAggregateIdValue' }]
          description: Omitted = append as last sibling.

    RemoveNodeAggregate:
      type: object
      required: [workspaceName, nodeAggregateId, coveredDimensionSpacePoint, nodeVariantSelectionStrategy]
      properties:
        workspaceName: { $ref: '#/components/schemas/WorkspaceNameValue' }
        nodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        coveredDimensionSpacePoint: { $ref: '#/components/schemas/DimensionSpacePoint' }
        nodeVariantSelectionStrategy:
          type: string
          enum: [allSpecializations, allVariants]
        removalAttachmentPoint:
          allOf: [{ $ref: '#/components/schemas/NodeAggregateIdValue' }]
          description: >
            Do not send - auto-filled with the closest document ancestor so
            the deletion stays publishable per document.
      description: >
        HARD removal. Prefer a soft delete via TagSubtree with
        `{"tag": "removed"}`, which is restorable from the workspace trash.

    SubtreeVisibilityPayload:
      type: object
      required: [workspaceName, nodeAggregateId, coveredDimensionSpacePoint, nodeVariantSelectionStrategy]
      properties:
        workspaceName: { $ref: '#/components/schemas/WorkspaceNameValue' }
        nodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        coveredDimensionSpacePoint: { $ref: '#/components/schemas/DimensionSpacePoint' }
        nodeVariantSelectionStrategy:
          type: string
          enum: [allSpecializations, allVariants]
      description: >
        Payload of DisableNodeAggregate / EnableNodeAggregate - sugar for
        (un)tagging the `disabled` subtree tag.

    TagSubtreePayload:
      allOf:
        - $ref: '#/components/schemas/SubtreeVisibilityPayload'
        - type: object
          required: [tag]
          properties:
            tag:
              type: string
              pattern: '^[a-z0-9_.-]{1,36}$'
              description: 'Neos-meaningful values: `removed` (soft delete), `disabled` (hidden).'
      description: Payload of TagSubtree / UntagSubtree.

    CreateNodeVariant:
      type: object
      required: [workspaceName, nodeAggregateId, sourceOrigin, targetOrigin]
      properties:
        workspaceName: { $ref: '#/components/schemas/WorkspaceNameValue' }
        nodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        sourceOrigin: { $ref: '#/components/schemas/DimensionSpacePoint' }
        targetOrigin: { $ref: '#/components/schemas/DimensionSpacePoint' }

    ChangeNodeAggregateType:
      type: object
      required: [workspaceName, nodeAggregateId, newNodeTypeName, strategy]
      properties:
        workspaceName: { $ref: '#/components/schemas/WorkspaceNameValue' }
        nodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        newNodeTypeName: { type: string }
        strategy:
          type: string
          description: >
            `delete` (remove newly disallowed children), `happypath` (only
            change when all constraints still hold), `promisedCascade`, or
            `mark_with_tag:<tagName>` (soft-hide disallowed children).
        tetheredDescendantNodeAggregateIds:
          type: object
          additionalProperties: { $ref: '#/components/schemas/NodeAggregateIdValue' }

    ChangeNodeAggregateName:
      type: object
      required: [workspaceName, nodeAggregateId, newNodeName]
      properties:
        workspaceName: { $ref: '#/components/schemas/WorkspaceNameValue' }
        nodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        newNodeName: { type: string, pattern: '^[a-z0-9\-]+$' }

    CopyNodesRecursively:
      type: object
      required: [workspaceName, sourceNodeAggregateId, targetParentNodeAggregateId, sourceDimensionSpacePoint, targetDimensionSpacePoint]
      properties:
        workspaceName: { $ref: '#/components/schemas/WorkspaceNameValue' }
        sourceNodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        targetParentNodeAggregateId: { $ref: '#/components/schemas/NodeAggregateIdValue' }
        sourceDimensionSpacePoint: { $ref: '#/components/schemas/DimensionSpacePoint' }
        targetDimensionSpacePoint: { $ref: '#/components/schemas/DimensionSpacePoint' }
        targetSucceedingSiblingNodeAggregateId:
          allOf: [{ $ref: '#/components/schemas/NodeAggregateIdValue' }]
          description: Omitted = append as last child.
        nodeAggregateIdMapping:
          type: object
          additionalProperties: { $ref: '#/components/schemas/NodeAggregateIdValue' }
          description: >
            Source id => new id. Pin the copy root's id to address the copy
            afterwards; unpinned ids are generated.
      description: >
        Copies a subtree within one workspace. Not atomic - a mid-copy failure
        leaves a partial copy. Document copies get a deduplicated
        `uriPathSegment`.

    # --- Media --------------------------------------------------------------

    Asset:
      type: object
      required: [assetSource, identifier, localAssetIdentifier, label, filename, mediaType, assetType, fileSize, lastModified, width, height, thumbnailUri, previewUri, isImported, isRemote, isReadOnly]
      properties:
        assetSource: { type: string }
        identifier:
          type: string
          description: Identifier within the asset source.
        localAssetIdentifier:
          type: [string, 'null']
          description: '`null` for a remote proxy that was never imported.'
        label: { type: string }
        filename: { type: string }
        mediaType: { type: string }
        assetType: { type: string, enum: [Image, Document, Video, Audio] }
        fileSize: { type: integer }
        lastModified: { type: string, format: date-time }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        thumbnailUri: { type: [string, 'null'] }
        previewUri: { type: [string, 'null'] }
        isImported: { type: boolean }
        isRemote: { type: boolean }
        isReadOnly: { type: boolean }
        title:
          type: string
          description: Local (`neos`) assets only, like the following fields.
        caption: { type: string }
        copyrightNotice: { type: string }
        tags:
          type: array
          items:
            type: object
            required: [identifier, label]
            properties:
              identifier: { type: string }
              label: { type: string }
        collections:
          type: array
          items:
            type: object
            required: [identifier, title]
            properties:
              identifier: { type: string }
              title: { type: string }
        originalAssetIdentifier:
          type: string
          description: Image variants only - the original image's identifier.
        crop:
          oneOf:
            - type: 'null'
            - type: object
              required: [x, y, width, height]
              properties:
                x: { type: integer }
                y: { type: integer }
                width: { type: integer }
                height: { type: integer }
          description: Image variants only - original-image pixel coordinates.
        iptc:
          type: object
          required: [title, caption, copyrightNotice]
          properties:
            title: { type: string }
            caption: { type: string }
            copyrightNotice: { type: string }
          description: Remote proxies with IPTC support only.
      description: >
        Base fields are always present; `title`/`caption`/`copyrightNotice`/
        `tags`/`collections` appear on local (`neos`) assets,
        `originalAssetIdentifier`/`crop` on image variants, `iptc` on remote
        proxies with IPTC metadata.

    MediaCollection:
      type: object
      required: [identifier, title, assetCount]
      properties:
        identifier: { type: string }
        title: { type: string }
        assetCount: { type: integer }

    MediaTag:
      type: object
      required: [identifier, label, parent, assetCount, children]
      properties:
        identifier: { type: string }
        label: { type: string }
        parent: { type: [string, 'null'] }
        assetCount:
          type: integer
          description: Count for this tag only, excluding children.
        children:
          type: array
          items: { $ref: '#/components/schemas/MediaTag' }

    # --- OAuth --------------------------------------------------------------

    TokenResponse:
      type: object
      required: [token_type, expires_in, access_token]
      properties:
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        access_token: { type: string, description: A signed JWT. }
        refresh_token:
          type: string
          description: Issued for authorization_code and refresh_token grants.

    OAuthProtocolError:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 'RFC 6749 error code, e.g. `invalid_grant`.' }
        error_description: { type: string }
        hint: { type: string }
        message: { type: string }
      additionalProperties: true
