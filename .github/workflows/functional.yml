name: Functional

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets a release be re-verified without an empty commit.
  workflow_dispatch:

# Same policy as ci.yml: supersede a run on a pull request branch, never one on
# main or a manual re-verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Installing Neos pulls well over a hundred packages as GitHub dist archives,
  # which exhausts the 60-per-hour unauthenticated API limit. Everything else,
  # Neos.OAuth and the OpenAPI bundle included, comes from Packagist.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

  # Everything neos/flow and neos/media declare, plus pdo_mysql for the database.
  PHP_EXTENSIONS: mbstring, xml, xmlreader, xmlwriter, simplexml, dom, tokenizer, zlib, gd, zip, fileinfo, iconv, pdo_mysql

jobs:
  # The suite cannot run in a standalone install: its tests extend Flow's
  # FunctionalTestCase, call the API through Flow's HTTP stack and create content
  # with Neos.Demo's node types. So it runs in Neos' base distribution, which
  # ships Neos.Demo, BuildEssentials and the PHPUnit Flow targets.
  #
  # The content repository needs MariaDB or MySQL; on another database its tests
  # skip themselves, which would pass this job without proving anything.
  functional:
    name: Functional (PHP 8.4, Neos 9.2)
    # GitHub-hosted: this repository is public, so its minutes are free, and a
    # self-hosted runner would execute code from pull requests opened on forks.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: flow_functional
          MARIADB_USER: flow
          MARIADB_PASSWORD: flow
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: package

      # This workflow switches itself on with the first functional test. Until
      # then every step below is skipped, rather than booting a whole Neos to
      # run nothing. hashFiles() only works inside steps, after the checkout, so
      # the decision is made here and not on the job.
      - name: Look for functional tests
        id: tests
        run: echo "found=${{ hashFiles('package/Tests/Functional/**/*.php') != '' }}" >> "$GITHUB_OUTPUT"

      # Flow's compile step needs more than PHP's default 128M.
      - name: Set up PHP
        if: steps.tests.outputs.found == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: memory_limit=-1
          tools: composer:v2
          coverage: none

      # The package goes in as a copy, not a symlink, so Flow resolves it under
      # Packages/Application like any installed package.
      - name: Prepare Neos distribution
        if: steps.tests.outputs.found == 'true'
        run: |
          git clone --depth 1 --branch 9.2 https://github.com/neos/neos-base-distribution.git dist
          cd dist
          composer config --no-plugins allow-plugins.neos/composer-plugin true
          composer config repositories.package '{ "type": "path", "url": "../package", "options": { "symlink": false } }'
          composer require --no-update --no-interaction medienreaktor/neos-api:@dev

      - name: Configure the database
        if: steps.tests.outputs.found == 'true'
        run: |
          mkdir -p dist/Configuration/Testing
          cat > dist/Configuration/Testing/Settings.yaml <<'YAML'
          Neos:
            Flow:
              persistence:
                backendOptions:
                  driver: pdo_mysql
                  host: 127.0.0.1
                  dbname: flow_functional
                  user: flow
                  password: flow
                  charset: utf8mb4
          YAML

      - name: Install dependencies
        if: steps.tests.outputs.found == 'true'
        working-directory: dist
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Show resolved dependency versions
        if: steps.tests.outputs.found == 'true'
        working-directory: dist
        run: composer show --direct

      # A skipped test fails the job: a content repository test that skips has
      # lost its database, and the run would otherwise pass without it.
      - name: Run Tests (PHPUnit, functional)
        if: steps.tests.outputs.found == 'true'
        working-directory: dist
        env:
          FLOW_CONTEXT: Testing
        run: bin/phpunit -c Build/BuildEssentials/PhpUnit/FunctionalTests.xml --fail-on-skipped Packages/Application/Neos.Api/Tests/Functional

      - name: Show logs on failure
        if: ${{ failure() }}
        working-directory: dist
        run: |
          for file in Data/Logs/*.log Data/Logs/Exceptions/*; do
            [ -f "$file" ] || continue
            echo "::group::$file"
            tail -n 200 "$file"
            echo "::endgroup::"
          done
